name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# 本仓不依赖 netmech，checkout 即可。

jobs:
  # ---------------------------------------------------------------------------
  # Linux / GCC + Clang
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          else
            # 用 runner 预装的 clang：apt 装 clang++ 常因版本被钉死而失败
            clang++ --version || { echo "::error::runner 上没有预装 clang++"; exit 1; }
          fi

      # 生成测试素材：缺失时依赖素材的往返/切分用例会自行跳过，覆盖率虚高。
      # 命令与 README「测试素材」一致；ffmpeg 缺了就装（runner 镜像通常已带）。
      - name: 生成测试素材（ffmpeg）
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx264 -x264-params aud=1 -pix_fmt yuv420p -f h264 /tmp/test_h264_aud.h264
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx265 -x265-params aud=0 -pix_fmt yuv420p -f hevc /tmp/test_nob.h265 2>/dev/null
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i sine=frequency=440:sample_rate=44100:duration=3 \
            -c:a aac -b:a 64k -f adts /tmp/test.aac
          # 直接用 lavfi 编码成 TS：把 raw H.264 用 -c copy 打进 TS 时
          # ffmpeg 会因"first pts and dts value must be set"失败。
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 \
            -f lavfi -i sine=frequency=440:sample_rate=44100:duration=3 -t 3 \
            -c:v libx264 -x264-params aud=1 -pix_fmt yuv420p \
            -c:a aac -b:a 64k /tmp/ff_av.ts

      - name: 配置
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DMPEGMECH_WARNINGS_AS_ERRORS=ON

      # 构建失败时把第一行错误/告警打到 annotation 上。
      # Actions 原始日志要通过 API 取需要管理员权限；annotation 是公开的。
      - name: 构建
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "error:" /tmp/build.log | cut -c1-300)
            [ -z "$line" ] && line=$(grep -m1 -E "warning:" /tmp/build.log | cut -c1-300)
            [ -z "$line" ] && line=$(tail -3 /tmp/build.log | tr '\n' ' ')
            echo "::error title=构建失败::$line"
            exit 1
          fi

      - name: 测试
        run: ctest --test-dir build --output-on-failure --timeout 120

      # 本仓每个 test/*.cpp 都是独立可执行（12 个），没有统一的 *_ut，
      # 所以失败时用 ctest -V 打详细输出。
      - name: 直接运行测试（失败时取详细输出）
        if: failure()
        run: ctest --test-dir build --output-on-failure --timeout 120 -V || true

  # ---------------------------------------------------------------------------
  # Windows / MSVC
  #
  # 生成器用 Ninja 而不用 Visual Studio 生成器：后者的探测在 runner 镜像升级后
  # 容易失效（报 "could not find any instance of Visual Studio" 或
  # "Failed to run MSBuild command"）。msvc-dev-cmd 摆好 cl 的环境再走 Ninja 更稳。
  #
  # 这里**不开** /WX：本仓依赖的第三方 / 平台头文件在 /W4 下的告警不由我们控制，
  # 让 "能不能编过" 成为这个 job 的判据。告警当错误只在 Linux 上做。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: |
          $out  = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n"
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error') { $idx = $i; break }
            }
            if ($idx -ge 0) {
              $end  = [Math]::Min($idx + 7, $lines.Count - 1)
              $errs = ($lines[$idx..$end] | Where-Object { $_.Trim() -ne '' }) -join ' | '
            } else {
              $errs = (($lines | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' | '
            }
            Write-Host "::error title=Windows configure failed::$errs"
            exit 1
          }

      - name: 构建
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'error C|: fatal|error MSB' } | Select-Object -First 2) -join ' | '
            Write-Host "::error title=Windows build failed::$line"
            exit 1
          }

      - name: 测试
        shell: pwsh
        run: |
          $out  = ctest --test-dir build --output-on-failure --timeout 120 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { Write-Host "::error title=Windows 单测失败"; exit 1 }

  # ---------------------------------------------------------------------------
  # ASan + UBSan
  #
  # 为什么要单独跑一遍：越界读和"无符号下溢"在 Release 上通常**没有任何症状** ——
  # 读到垃圾数据被当成未知字段跳过，或者循环多转几圈但结果碰巧对。
  # 2026-11 就出过一次：mpegmech 的 test_g711_ps 在 Windows Debug 上卡 120 秒，
  # 根因是 `in[code_at]` 越界读 + `in.size() - scan` 下溢；Linux Release 一直绿。
  #
  # 关掉 detect_leaks：库里有些对象是刻意长命的（进程级 io 池等），
  # 让 LeakSanitizer 报它们只会训练大家忽略告警。
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      # 生成测试素材：缺失时依赖素材的往返/切分用例会自行跳过，覆盖率虚高。
      # 命令与 README「测试素材」一致；ffmpeg 缺了就装（runner 镜像通常已带）。
      - name: 生成测试素材（ffmpeg）
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx264 -x264-params aud=1 -pix_fmt yuv420p -f h264 /tmp/test_h264_aud.h264
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx265 -x265-params aud=0 -pix_fmt yuv420p -f hevc /tmp/test_nob.h265 2>/dev/null
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i sine=frequency=440:sample_rate=44100:duration=3 \
            -c:a aac -b:a 64k -f adts /tmp/test.aac
          ffmpeg -y -hide_banner -loglevel error -fflags +genpts \
            -i /tmp/test_h264_aud.h264 -i /tmp/test.aac \
            -c copy -map 0:v -map 1:a /tmp/ff_av.ts

      - name: 配置（Debug + sanitizer）
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DMPEGMECH_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 测试（sanitizer 一旦报错立即失败）
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        # 失败时把关键行打进 annotation（原始日志要管理员权限才取得到）
        run: |
          set +e
          ctest --test-dir build-san --output-on-failure --timeout 300 2>&1 | tee /tmp/san.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "ERROR: AddressSanitizer|runtime error|SEGV|FAIL\]|Timeout|FAILED" /tmp/san.log | cut -c1-320)
            [ -z "$line" ] && line=$(tail -5 /tmp/san.log | tr '\n' ' ')
            echo "::error title=sanitizer 失败::$line"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # TSan（数据竞争）
  #
  # ASan/UBSan 抓不到数据竞争：两个线程同时碰一块内存，读到的值"碰巧对"时
  # 一点症状都没有。本库主体是单线程的（Muxer/Demuxer 都写明非线程安全），
  # 但 mux/demux 的**回调**、以及测试里的多线程用法仍值得盯一眼。
  #
  # 2026-11 首次跑是 0 条，所以**不留 suppression**：再报就是真问题。
  #
  # 测试素材由前面的 ffmpeg 步骤生成；若该步骤失败/跳过，依赖素材的用例
  # 会自行"跳过并返回 0"、覆盖率缩水 —— 看「生成测试素材」步骤的输出即可确认。
  # ---------------------------------------------------------------------------
  tsan:
    name: TSan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      # 生成测试素材：缺失时依赖素材的往返/切分用例会自行跳过，覆盖率虚高。
      # 命令与 README「测试素材」一致；ffmpeg 缺了就装（runner 镜像通常已带）。
      - name: 生成测试素材（ffmpeg）
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx264 -x264-params aud=1 -pix_fmt yuv420p -f h264 /tmp/test_h264_aud.h264
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=25 -t 3 \
            -c:v libx265 -x265-params aud=0 -pix_fmt yuv420p -f hevc /tmp/test_nob.h265 2>/dev/null
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i sine=frequency=440:sample_rate=44100:duration=3 \
            -c:a aac -b:a 64k -f adts /tmp/test.aac
          ffmpeg -y -hide_banner -loglevel error -fflags +genpts \
            -i /tmp/test_h264_aud.h264 -i /tmp/test.aac \
            -c copy -map 0:v -map 1:a /tmp/ff_av.ts

      - name: 配置（Debug + TSan）
        run: |
          cmake -S . -B build-tsan -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
                -DMPEGMECH_BUILD_TESTS=ON \
                -DMPEGMECH_BUILD_EXAMPLES=OFF

      - name: 构建
        run: cmake --build build-tsan --parallel

      - name: 测试（报告任何数据竞争即失败）
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # 质量门禁
  # ---------------------------------------------------------------------------
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止的 C++20 特性
        run: |
          FAIL=0
          # 只看代码，跳过纯注释行
          for pat in 'co_await' 'co_return' 'co_yield' 'std::span' 'std::format' \
                     'std::jthread' 'std::atomic_ref' '\bconcept\b' '\branges::' '<=>'; do
            hits=$(grep -rEn "$pat" include/ src/ example/ test/ \
                     --include='*.hpp' --include='*.cpp' 2>/dev/null \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
            if [ -n "$hits" ]; then
              echo "❌ 发现禁止的构造: $pat"
              echo "$hits"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 未发现 C++20 构造"

      - name: 检查不得引入 Boost / OpenSSL
        run: |
          # 只看 #include：注释里提到 boost::beast 是在讲"为什么不用它"
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(boost|openssl)/' \
               include/ src/ example/ test/ --include='*.hpp' --include='*.cpp'; then
            echo "❌ 发现有 boost / openssl 的 #include（本库零外部依赖）"
            exit 1
          fi
          echo "✅ 无 Boost / OpenSSL 依赖"

      - name: 检查对外头文件不依赖 Asio
        run: |
          # 装出去的包**不带 Asio**（公共头一行 asio 都不引，asio 只在 src/ 里用）。
          # 一旦有人在 include/ 里加回 `#include <asio/...>`，使用者就得自己装
          # 一套 Asio 才编得过 —— 这条检查用来守住这个边界。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(asio|asio\.hpp)' \
               include/ --include='*.hpp'; then
            echo "❌ 对外头文件包含了 asio（装出去的包不该依赖它）"
            exit 1
          fi
          echo "✅ 对外头文件无 asio 依赖"

      - name: 检查每个对外头文件可单独包含
        run: |
          sudo apt-get update && sudo apt-get install -y g++
          FAIL=0
          for h in include/mpegmech/*.hpp; do
            name=$(basename "$h" .hpp)
            printf '#include <mpegmech/%s.hpp>\nint main(){return 0;}\n' "$name" > /tmp/one.cpp
            if ! g++ -std=c++17 -fsyntax-only -Wall -Wextra \
                 -Iinclude /tmp/one.cpp; then
              echo "❌ $name.hpp 不能单独包含"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 全部头文件自包含"
